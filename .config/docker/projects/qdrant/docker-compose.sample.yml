name: "qdrant"
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    user: "${QDRANT_UID}:${QDRANT_GID}"
    volumes:
      - type: bind
        source: ${VOLUME_DATA_DIR}/qdrant/storage
        target: /qdrant/storage
      - type: bind
        source: ${VOLUME_DATA_DIR}/qdrant/snapshots
        target: /qdrant/snapshots
      - type: bind
        source: ${VOLUME_DATA_DIR}/qdrant/config
        target: /qdrant/config
    ports:
      - "${PUBLIC_PORT}:6333"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "qdrant"
      tsdproxy.container_port: ${PUBLIC_PORT}
